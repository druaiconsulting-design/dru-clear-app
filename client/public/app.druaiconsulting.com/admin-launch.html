<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal</title>

  <!-- PWA Meta Tags -->
  <meta name="application-name" content="Admin Portal" />
  <meta name="apple-mobile-web-app-title" content="Admin Portal" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#7B1A2E" />

  <!-- PWA Icons — deep burgundy background with DC shield initials -->
  <link rel="apple-touch-icon" href="#" id="apple-icon" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #7B1A2E;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    /* Subtle radial glow */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(212,175,55,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .icon-wrap {
      width: 96px;
      height: 96px;
      border-radius: 22px;
      background: linear-gradient(145deg, #7B1A2E, #5a1222);
      border: 2px solid rgba(212,175,55,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(212,175,55,0.2);
    }

    .icon-wrap svg {
      width: 56px;
      height: 56px;
    }

    .label {
      font-family: 'Georgia', serif;
      color: #D4AF37;
      font-size: 1.1rem;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }

    .sublabel {
      font-family: Arial, sans-serif;
      color: rgba(255,255,255,0.45);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .spinner {
      margin-top: 32px;
      width: 28px;
      height: 28px;
      border: 2px solid rgba(212,175,55,0.2);
      border-top-color: #D4AF37;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="icon-wrap">
    <!-- DC Shield SVG -->
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M28 4L6 13v16c0 11.5 9.3 22.2 22 25 12.7-2.8 22-13.5 22-25V13L28 4z"
            fill="rgba(212,175,55,0.15)" stroke="#D4AF37" stroke-width="1.5"/>
      <text x="28" y="34" text-anchor="middle"
            font-family="Georgia, serif" font-size="16" font-weight="bold"
            fill="#D4AF37" letter-spacing="1">DC</text>
    </svg>
  </div>

  <div class="label">Admin Portal</div>
  <div class="sublabel">DRU AI Consulting</div>
  <div class="spinner"></div>

  <script>
    // Generate and inject PWA icon as canvas-based data URL
    const canvas = document.createElement('canvas');
    canvas.width = 192;
    canvas.height = 192;
    const ctx = canvas.getContext('2d');

    // Background
    const grad = ctx.createLinearGradient(0, 0, 192, 192);
    grad.addColorStop(0, '#7B1A2E');
    grad.addColorStop(1, '#5a1222');
    ctx.fillStyle = grad;
    ctx.roundRect(0, 0, 192, 192, 36);
    ctx.fill();

    // Gold border
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = 4;
    ctx.roundRect(4, 4, 184, 184, 32);
    ctx.stroke();

    // Shield shape
    ctx.beginPath();
    ctx.moveTo(96, 30);
    ctx.lineTo(40, 55);
    ctx.lineTo(40, 105);
    ctx.quadraticCurveTo(40, 145, 96, 162);
    ctx.quadraticCurveTo(152, 145, 152, 105);
    ctx.lineTo(152, 55);
    ctx.closePath();
    ctx.strokeStyle = '#D4AF37';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.fillStyle = 'rgba(212,175,55,0.1)';
    ctx.fill();

    // DC text
    ctx.fillStyle = '#D4AF37';
    ctx.font = 'bold 42px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('DC', 96, 100);

    const dataUrl = canvas.toDataURL('image/png');

    // Inject as apple-touch-icon
    const link = document.getElementById('apple-icon');
    link.href = dataUrl;

    // Also add standard icon link
    const iconLink = document.createElement('link');
    iconLink.rel = 'icon';
    iconLink.href = dataUrl;
    document.head.appendChild(iconLink);

    // Redirect to admin portal after brief splash
    setTimeout(() => {
      window.location.replace('https://app.druaiconsulting.com/admin');
    }, 1200);
  </script>

</body>
</html>
